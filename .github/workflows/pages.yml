name: Deploy Redline Oval to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check && npm test
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble static game
        run: |
          mkdir -p dist
          cp index.html style.css game.js engine.js sw.js icon.svg icon-192.png icon-512.png manifest.webmanifest dist/
      - name: Name this build artifact
        id: artifact
        run: echo "name=redline-pages-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
